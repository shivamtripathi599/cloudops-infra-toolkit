# Reusable CI caller — consumes the shared workflow from
# github-actions-ci-templates so pipeline logic lives in one place.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    uses: shivamtripathi599/github-actions-ci-templates/.github/workflows/python-ci.yml@main
    with:
      python-version: "3.11"
      install-command: "pip install -e . && pip install pytest"
