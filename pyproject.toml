[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudops-infra-toolkit"
version = "1.0.0"
description = "Dependency-free CLI for cost reporting, Docker health, and safe Kubernetes pod remediation."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Shivam Tripathi" }]
keywords = ["cloudops", "sre", "devops", "kubernetes", "docker", "cost", "cli"]

[project.scripts]
cloudops = "cloudops.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
